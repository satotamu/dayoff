<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="description" content="デイ・オフ">
  <title> </title>
  <style>
    :root {font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color:#354a49; background:#f5f2e9}
    *{box-sizing:border-box} 


body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(
      ellipse at 10% 15%,
      #ffeaea 0%,
      transparent 65%
    ),
    radial-gradient(
      ellipse at 90% 85%,
      #f9f4ff 0%,
      transparent 65%
    ),
    #fff9f9;

  background-attachment: fixed;
}

    
    .wrap{max-width:520px;margin:auto;padding:28px 22px 52px}.top{display:flex;justify-content:space-between;align-items:center;font-size:.7rem;letter-spacing:.19em;color:#647776}
    .mark{border:1px solid #8c9b96;border-radius:50%;padding:9px 6px;font-size:11px}.cover{width:min(70vw,280px);aspect-ratio:1;display:block;object-fit:cover;border-radius:4px;margin:35px auto 20px;box-shadow:0 13px 32px #283e392b}
    .title{text-align:center;font-size:2.25rem;letter-spacing:.12em;margin:0;font-weight:650}.subtitle{text-align:center;letter-spacing:.15em;font-size:.7rem;color:#748782;margin:9px 0 30px}
    .heading{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #bbc9c1;padding-bottom:9px;margin-bottom:10px}.heading h2{font-size:1rem;letter-spacing:.1em;margin:0}.heading small{color:#768984}
    .track{background:#fffcf5cc;padding:16px 14px;border-radius:11px;margin:9px 0;border:1px solid #e4e5d9}.trackhead{display:flex;gap:12px;align-items:center}.num{font-size:.83rem;color:#859b95}.name{font-weight:600;flex:1}.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.links a{font-size:.74rem;color:#3f645e;text-decoration:none;border:1px solid #b9cdc6;padding:8px 11px;border-radius:999px;background:#eef5ef}.links a:hover,.links a:focus{background:#d7e9df}.disabled{font-size:.76rem;color:#89928e;margin-top:10px}
    .footer{text-align:center;margin-top:32px;font-size:.73rem;color:#758781;line-height:1.8}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><span> </span><span class="mark">1st EP</span></header>
    <img class="cover" src="cover.png" alt="デイ・オフ 仮ジャケット。自分のジャケット画像に置き換えてください。">
    <h1 class="title">デイ・オフ</h1><p class="subtitle">青春の淡い記憶を曲にzipしてお届け！！！近日サブスクにも公開！！</p>
    <section aria-labelledby="tracks-title">
      <div class="heading"><h2 id="tracks-title">TRACK LIST</h2><small>5 TRACKS</small></div>

<a class="tunecore-button"
   href=""
   target="_blank"
   rel="noopener noreferrer">
  ♪ TuneCoreで配信先をまとめて見る(準備中) ↗
</a>

      
      <div id="tracks"></div>
    </section>
    <footer class="footer">　<br>サトウ タム Email:contacttotamtam@gmail.com</footer>
  </main>
  <script>
    // ここだけ編集すれば曲名と配信先を変更できます。
    // 配信URLが未定の場合は空文字 "" のままにしてください。
const tracks = [
  { name: "デイ・オフ", soundcloud:"https://on.soundcloud.com/vSqc020aqKXwBIT4pt", spotify: "", apple: "", youtube: "" },
  { name: "Tandem", soundcloud:"https://on.soundcloud.com/3kM5KJ95h6017eihr8", spotify: "", apple: "", youtube: "https://youtu.be/ntnyFx-LNX8?si=AdCxhpAeGxUYu-_W" },
  { name: "ひとつひとつ", soundcloud:"https://on.soundcloud.com/pFLKw8xJJgK7VREQAf", spotify: "", apple: "", youtube: "https://youtu.be/FcGJO5glL34?si=e7MYOtUECb_Irtid" },
  { name: "Tandem (Instrumental)", soundcloud:"https://on.soundcloud.com/USbj9kCI3Cew42DpqA", spotify: "", apple: "", youtube: "https://youtu.be/WLjQG_uqA5k?si=Y4qTKuYNxHkVJ_oh" },
  { name: "ひとつひとつ (Instrumental)",soundcloud:"https://on.soundcloud.com/pFZMvi5FPuzQAhmw4N",  spotify: "", apple: "", youtube: "https://youtu.be/v0KFSUhYW6I?si=uENPEjBl52Sv2HRW" }
];
    const services = [["soundcloud", "SoundCloudで聞く！"],["spotify", "Spotify"], ["apple", "Apple Music"], ["youtube", "YouTube で聞く！"]];
    const root = document.getElementById("tracks");
    tracks.forEach((track, index) => {
      const card = document.createElement("article");card.className = "track";
      const head = document.createElement("div");head.className = "trackhead";
      const num = document.createElement("span");num.className="num";num.textContent=String(index + 1).padStart(2,"0");
      const name=document.createElement("span");name.className="name";name.textContent=track.name;
      head.append(num,name);card.append(head);
      const links=document.createElement("div");links.className="links";
      services.forEach(([key,label]) => {
        const url=track[key];
        if(!url) return;
        try{const parsed=new URL(url);if(!["https:","http:"].includes(parsed.protocol))return;}catch{return;}
        const a=document.createElement("a");a.href=url;a.textContent=label+" ↗";a.target="_blank";a.rel="noopener noreferrer";links.append(a);
      });
      if(links.children.length){card.append(links)}else{const msg=document.createElement("div");msg.className="disabled";msg.textContent="配信リンク準備中";card.append(msg)}
      root.append(card);
    });
  </script>
</body>
</html>
